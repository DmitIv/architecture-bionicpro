networks:
  bionicpro-network:
    driver: bridge

services:
  ldap:
    image: osixia/openldap:1.5.0
    container_name: bionicpro-ldap
    environment:
      LDAP_ORGANISATION: "BionicPRO"
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_CONFIG_PASSWORD: "config"
      LDAP_READONLY_USER: "false"
      LDAP_RFC2307BIS_SCHEMA: "false"
      LDAP_BACKEND: "mdb"
      LDAP_TLS: "false"
    volumes:
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
    ports:
      - "389:389"
      - "636:636"
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -b dc=example,dc=com -D 'cn=admin,dc=example,dc=com' -w admin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - bionicpro-network

  ldap-admin:
    image: osixia/phpldapadmin:0.9.0
    container_name: bionicpro-ldap-admin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "ldap"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8081:80"
    depends_on:
      ldap:
        condition: service_healthy
    networks:
      - bionicpro-network

  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - bionicpro-network

  postgres:
    image: postgres:14
    container_name: bionicpro-postgres
    environment:
      POSTGRES_DB: bionicpro_users
      POSTGRES_USER: bionicpro
      POSTGRES_PASSWORD: secure_password
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
      - ./bionicpro-auth/migrations/001_create_user_profiles.sql:/docker-entrypoint-initdb.d/01-create-user-profiles.sql
      - ./task2/airflow/init-airflow-db.sql:/docker-entrypoint-initdb.d/02-init-airflow-db.sql
    ports:
      - "5432:5432"
    networks:
      - bionicpro-network

  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      keycloak_db:
        condition: service_started
      ldap:
        condition: service_healthy
    networks:
      - bionicpro-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - bionicpro-network

  bionicpro-auth:
    build: ./bionicpro-auth
    ports:
      - "8000:8000"
    environment:
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=reports-realm
      - KEYCLOAK_CLIENT_ID=reports-frontend
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SESSION_SECRET_KEY=dev-secret-key-change-in-production
      - ENCRYPTION_KEY=CzH5pTV9bQN6jQWX+1RXI8qPgvW8VmO8gInqGGSMb8E=
      - FRONTEND_URL=http://localhost:3000
      - ALLOWED_FRONTEND_URLS=http://localhost:3000,http://frontend.architecture-bionicpro.orb.local:3000,http://frontend.architecture-bionicpro.orb.local
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8000,http://frontend.architecture-bionicpro.orb.local:3000,http://frontend.architecture-bionicpro.orb.local
      # Yandex OAuth Configuration
      - YANDEX_CLIENT_ID=${YANDEX_CLIENT_ID:-your_yandex_client_id_here}
      - YANDEX_CLIENT_SECRET=${YANDEX_CLIENT_SECRET:-your_yandex_client_secret_here}
      # Database Configuration for User Profiles
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=bionicpro_users
      - POSTGRES_USER=bionicpro
      - POSTGRES_PASSWORD=secure_password
    depends_on:
      - keycloak
      - redis
      - postgres
    volumes:
      - ./bionicpro-auth:/app
    restart: unless-stopped
    networks:
      - bionicpro-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8001
      REACT_APP_AUTH_URL: http://localhost:8000
    depends_on:
      - bionicpro-auth
    restart: unless-stopped
    networks:
      - bionicpro-network

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: bionicpro-clickhouse
    ports:
      - "8123:8123"
      - "9004:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    networks:
      - bionicpro-network

  airflow-init:
    build: ./task2/airflow
    container_name: bionicpro-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init &&
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow_user:airflow_password@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: CzH5pTV9bQN6jQWX+1RXI8qPgvW8VmO8gInqGGSMb8E=
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    volumes:
      - ./task2/airflow/dags:/opt/airflow/dags
    depends_on:
      - postgres
    networks:
      - bionicpro-network

  airflow-webserver:
    build: ./task2/airflow
    container_name: bionicpro-airflow-webserver
    command: airflow webserver
    ports:
      - "8084:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow_user:airflow_password@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: CzH5pTV9bQN6jQWX+1RXI8qPgvW8VmO8gInqGGSMb8E=
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    volumes:
      - ./task2/airflow/dags:/opt/airflow/dags
    depends_on:
      - airflow-init
      - postgres
      - clickhouse
    networks:
      - bionicpro-network

  airflow-scheduler:
    build: ./task2/airflow
    container_name: bionicpro-airflow-scheduler
    command: airflow scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow_user:airflow_password@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: CzH5pTV9bQN6jQWX+1RXI8qPgvW8VmO8gInqGGSMb8E=
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    volumes:
      - ./task2/airflow/dags:/opt/airflow/dags
    depends_on:
      - airflow-init
      - postgres
      - clickhouse
    networks:
      - bionicpro-network

  reports-api:
    build: ./reports-api
    container_name: bionicpro-reports-api
    ports:
      - "8001:8000"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DATABASE: default
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: bionicpro
      # S3/MinIO Configuration
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      S3_BUCKET_NAME: reports
      # CDN Configuration
      CDN_BASE_URL: http://localhost:8082
    depends_on:
      - clickhouse
      - keycloak
      - minio
    networks:
      - bionicpro-network

  minio:
    image: minio/minio:latest
    container_name: bionicpro-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - bionicpro-network

  nginx-cdn:
    image: nginx:alpine
    container_name: bionicpro-nginx-cdn
    ports:
      - "8082:80"
    volumes:
      - ./task3/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./task3/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx-cache:/var/cache/nginx
      - nginx-logs:/var/log/nginx
    depends_on:
      - minio
    networks:
      - bionicpro-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: bionicpro-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - bionicpro-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: bionicpro-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
    depends_on:
      - zookeeper
    networks:
      - bionicpro-network

  kafka-connect:
    image: debezium/connect:2.4.1.Final
    container_name: bionicpro-kafka-connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_status
    depends_on:
      - kafka
    networks:
      - bionicpro-network

volumes:
  redis-data:
  ldap-data:
  ldap-config:
  postgres-user-data:
  clickhouse-data:
  minio-data:
  nginx-cache:
  nginx-logs:
