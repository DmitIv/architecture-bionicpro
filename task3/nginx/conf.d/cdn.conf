# CDN конфигурация для MinIO S3 хранилища

upstream minio_backend {
    server minio:9000;
}

# Кеширование
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=reports_cache:10m max_size=1g
                 inactive=1d use_temp_path=off;

server {
    listen 80;
    server_name localhost;

    # CORS headers
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

    # Обработка OPTIONS запросов
    if ($request_method = 'OPTIONS') {
        return 204;
    }
    add_header 'Access-Control-Max-Age' 1728000;
    add_header 'Content-Type' 'text/plain; charset=utf-8';
    add_header 'Content-Length' 0;

    # Основной location для CDN
    location / {
        # Кеширование только для отчетов
        location ~* ^/reports/ {
            proxy_cache reports_cache;
            proxy_cache_valid 200 1d;
            proxy_cache_valid 404 1m;
            proxy_cache_key "$scheme$request_method$host$request_uri";

            # Добавляем заголовки для отладки кеширования
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Cache-Key "$scheme$request_method$host$request_uri" always;

            # Proxy настройки
            proxy_pass http://minio_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Таймауты
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Буферизация
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # Для остальных запросов без кеширования
        proxy_pass http://minio_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "CDN is healthy\n";
        add_header Content-Type text/plain;
    }

    # Статус кеширования (для отладки)
    location /cache-status {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        access_log off;
        return 200 "Cache status: $upstream_cache_status\n";
        add_header Content-Type text/plain;
    }
}
